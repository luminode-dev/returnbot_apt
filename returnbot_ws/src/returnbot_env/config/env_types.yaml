# 리턴봇 파라메트릭 월드 — 치수 원본 (Single Source of Truth)
#
# 단위: 길이 m, 각도 rad, 질량 kg
# 모든 값은 {value, confidence, source} 형태로 근거를 함께 기록한다.
#   confidence: confirmed = 법령 명시 / reference = 공개자료·법령 정합 / todo = 근거 미확보
# 근거 상세는 docs/env_reference.md 참조. 코드에 상수를 하드코딩하지 말 것 (명세 §7).

meta:
  reference_doc: docs/env_reference.md
  units: m

