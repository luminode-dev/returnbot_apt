# --------------------------------------------------------------- 유형 정의
types:
  A:
    label: "편복도(갓복도)형"
    description: "한쪽 벽면에 세대문 일렬, 반대편은 개방 난간. 법규 최소폭 1.2m가 최악 조건"
    corridor_width:
      value: 1.2
      confidence: confirmed
      source: "건축물의 피난·방화구조 등의 기준에 관한 규칙 제15조의2 제1항 - 공동주택 그 밖의 복도 1.2m 이상"
    corridor_length:
      value: 20.0
      confidence: todo
      source: "TODO(확인) 세대수 x door.pitch 로 산출. 실증 단지 확정 시 대체"
    unit_count:
      value: 5
      confidence: todo
      source: "TODO(확인) 한 개 층 세대수"
    door_side: "+y"
    open_side: "-y"
    floor_material: corridor_tile

  B:
    label: "중복도형"
    description: "양쪽 세대문. 마주보는 세대 동시 배출 시나리오"
    corridor_width:
      value: 1.8
      confidence: confirmed
      source: "건축물의 피난·방화구조 등의 기준에 관한 규칙 제15조의2 제1항 - 양옆에 거실이 있는 복도 1.8m 이상"
    corridor_length:
