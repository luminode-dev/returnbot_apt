      confidence: todo
      source: "TODO(확인)"
    unit_count:
      value: 5
      confidence: todo
      source: "TODO(확인) 편측 세대수 (양측이므로 실제 세대는 2배)"
    door_side: "both"
    open_side: null
    floor_material: corridor_tile

  C:
    label: "계단식(홀형)"
    description: "엘리베이터홀 + 세대 2~4호. 복도 없음. 최신 아파트 주류"
