# 유형별 로봇 스폰 위치 (Phase 0 월드 좌표계 기준).
#
# 월드 좌표계: X = 복도 길이축(주행 방향), Y = 복도 폭축(중심선 y=0), Z = 상방.
# z 는 바퀴 반경보다 살짝 위에서 떨어뜨려 초기 관통을 피한다.
#
# 이 값들이 벽/문턱과 겹치면 스폰 순간 물리가 튄다. 월드 인자(복도폭 등)를 바꾸면
# 함께 확인할 것.

A:
  x: 1.5
  y: 0.0
  z: 0.12
  yaw: 0.0
  note: "편복도 시작단. 첫 세대문(x=2.0) 직전"

B:
  x: 1.5
  y: 0.0
  z: 0.12
  yaw: 0.0
  note: "중복도 시작단"

C:
  x: 1.6
