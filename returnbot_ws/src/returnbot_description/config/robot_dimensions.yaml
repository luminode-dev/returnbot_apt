# 리턴봇 차체 치수 원본 (Single Source of Truth)
#
# 단위: 길이 m, 질량 kg
# confidence:
#   spec        = 명세 §3에 명시된 확정 기준값
#   spec_draft  = 명세 §3의 "가안". 시뮬 검증 결과로 확정한다
#   todo        = 명세에도 없는 값. 임의 설정했으므로 설계 확정 시 반드시 교체
#
# urdf/robot_params.xacro 의 xacro:arg 기본값이 이 파일과 일치하는지
# tests/test_urdf_params.py 가 검사한다 (두 곳이 갈라지는 것을 막는다).

meta:
  spec_doc: returnbot-sim-spec.md
  units: m, kg

drive:
  wheel_radius:
    value: 0.1
    confidence: spec
    source: "명세 §3 구동륜 지름 200mm(8인치)"
  wheel_width:
    value: 0.05
    confidence: spec
    source: "명세 §3 구동륜 폭 50mm"
  wheel_separation:
    value: 0.45
    confidence: spec_draft
    source: "명세 §3 바퀴 간격 L 450mm (가안). 편복도 1.2m 검증 결과로 확정"
  wheel_mass:
    value: 2.5
    confidence: todo
    source: "TODO(확인) 허브모터 + 솔리드타이어 실측 필요"

